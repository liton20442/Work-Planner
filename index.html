<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
      viewport-fit=cover">

<meta name="theme-color" content="#0f766e">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Work Planner">

<link rel="manifest" href="manifest.json">

<title>Work Planner</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    background:#f4f7f8;
    color:#1f2937;
}

header{
    background:#0f766e;
    color:white;
    padding:18px 14px;
    text-align:center;
    position:sticky;
    top:0;
    z-index:10;
    box-shadow:0 4px 12px rgba(15,118,110,.22);
}

header h1{
    margin:0;
    font-size:24px;
    font-weight:700;
}

header p{
    margin:5px 0 0;
    font-size:14px;
    opacity:.95;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:9px;
}

.form-card{
    background:#ffffff;
    border-radius:14px;
    padding:10px;
    box-shadow:0 4px 14px rgba(15,118,110,.10);
    margin-bottom:12px;
    border:1px solid #d9f0ed;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 2fr 1fr auto;
    gap:8px;
    align-items:end;
}

.field{
    display:flex;
    flex-direction:column;
}

.field label{
    font-size:13px;
    font-weight:600;
    margin-bottom:5px;
    color:#155e75;
}

input,
select,
button{
    width:100%;
    min-height:44px;
    border:1px solid #cbd5e1;
    border-radius:8px;
    padding:8px 10px;
    font-size:16px;
    background:white;
}

input:focus,
select:focus{
    outline:none;
    border-color:#0d9488;
    box-shadow:0 0 0 3px rgba(13,148,136,.13);
}

button{
    color:white;
    border:none;
    font-weight:700;
    cursor:pointer;
    padding-left:16px;
    padding-right:16px;
    box-shadow:0 3px 8px rgba(0,0,0,.15);
}

button:active{
    transform:scale(.97);
}

/* Solid Button Colors Only */

.add-btn{
    background:#0d9488;
}

.backup-btn{
    background:#2563eb;
}

.restore-btn{
    background:#7c3aed;
}

.utility-buttons{
    display:flex;
    gap:8px;
    margin-top:9px;
}

.utility-buttons button{
    flex:1;
}

.table-card{
    background:#ffffff;
    border-radius:14px;
    box-shadow:0 4px 14px rgba(15,118,110,.10);
    overflow:hidden;
    border:1px solid #dcefeb;
}

.table-wrap{
    width:100%;
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:630px;
    table-layout:fixed;
}

thead{
    background:#e5f5f2;
}

th{
    padding:8px 7px;
    text-align:left;
    font-size:13px;
    font-weight:700;
    white-space:nowrap;
    border-bottom:1px solid #b9dfda;
    color:#134e4a;
}

td{
    padding:4px;
    font-size:17px;
    border-bottom:1px solid #e5e7eb;
    vertical-align:middle;
    background:#ffffff;
}

tbody tr:last-child td{
    border-bottom:none;
}

tbody tr:hover td{
    background:#f0fdfa;
}

th:nth-child(1),
td:nth-child(1){
    width:18%;
}

th:nth-child(2),
td:nth-child(2){
    width:22%;
}

th:nth-child(3),
td:nth-child(3){
    width:10%;
}

th:nth-child(4),
td:nth-child(4){
    width:17%;
}

th:nth-child(5),
td:nth-child(5){
    width:8%;
    text-align:center;
}

td input,
td select{
    min-height:40px;
    font-size:17px;
    padding:7px 8px;
}

.action-select{
    min-width:105px;
    font-weight:600;
    color:#92400e;
    background:#fffbeb;
    border-color:#fcd34d;
}

.delete-btn{
    width:38px;
    min-width:38px;
    height:38px;
    min-height:38px;
    padding:0;
    border-radius:8px;
    background:#ef4444;
    color:white;
    font-size:21px;
    line-height:1;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 2px 6px rgba(220,38,38,.22);
}

.delete-btn:hover{
    background:#dc2626;
}

.empty{
    text-align:center;
    padding:25px 15px;
    color:#64748b;
    font-size:14px;
    background:#f8fffe;
}

@media(max-width:700px){

    .container{
        padding:9px;
    }

    .form-grid{
        grid-template-columns:1fr;
        gap:8px;
    }

    .form-card{
        padding:10px;
    }

    header h1{
        font-size:22px;
    }

    table{
        min-width:630px;
    }

    th{
        font-size:12px;
        padding:7px 6px;
    }

    td{
        font-size:17px;
        padding:6px;
    }

    td input,
    td select{
        font-size:17px;
        min-height:38px;
        padding:6px 7px;
    }

    .delete-btn{
        width:36px;
        min-width:36px;
        height:36px;
        min-height:36px;
        font-size:20px;
    }

    .utility-buttons{
        flex-direction:row;
    }
}
</style>
</head>

<body>

<header>
    <h1>Work Planner</h1>
    <p>Daily Work Management</p>
</header>

<div class="container">

    <div class="form-card">

        <div class="form-grid">

            <div class="field">
                <label for="workDate">Date</label>
                <input type="date"
                       id="workDate"
                       autocomplete="off">
            </div>

            <div class="field">
                <label for="workDescription">Work Description</label>
                <input type="text"
                       id="workDescription"
                       autocomplete="off"
                       placeholder="Enter work description">
            </div>

            <div class="field">
                <label for="workTime">Time</label>
                <input type="text"
                       id="workTime"
                       autocomplete="off"
                       placeholder="Enter time">
            </div>

            <div class="field">
                <button type="button"
                        id="addWorkBtn"
                        class="add-btn">
                    Add Work
                </button>
            </div>

        </div>

        <div class="utility-buttons">

            <button type="button"
                    id="backupBtn"
                    class="backup-btn">
                Backup Data
            </button>

            <button type="button"
                    id="restoreBtn"
                    class="restore-btn">
                Restore Data
            </button>

        </div>

        <input type="file"
               id="restoreFile"
               accept=".json,application/json,.backup"
               style="display:none;">

    </div>

    <div class="table-card">

        <div class="table-wrap">

            <table>

                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Work Description</th>
                        <th>Time</th>
                        <th>Action</th>
                        <th>Delete</th>
                    </tr>
                </thead>

                <tbody id="workTableBody"></tbody>

            </table>

        </div>

        <div id="emptyMessage" class="empty">
            No work added yet.
        </div>

    </div>

</div>

<script>

const STORAGE_KEY = "workPlannerDataV1";

let works = [];

try{

    const saved =
        localStorage.getItem(STORAGE_KEY);

    if(saved){

        const parsed =
            JSON.parse(saved);

        if(Array.isArray(parsed)){
            works = parsed;
        }

    }

}catch(error){

    works = [];

}

const workDate =
    document.getElementById("workDate");

const workDescription =
    document.getElementById("workDescription");

const workTime =
    document.getElementById("workTime");

const addWorkBtn =
    document.getElementById("addWorkBtn");

const backupBtn =
    document.getElementById("backupBtn");

const restoreBtn =
    document.getElementById("restoreBtn");

const restoreFile =
    document.getElementById("restoreFile");

const workTableBody =
    document.getElementById("workTableBody");

const emptyMessage =
    document.getElementById("emptyMessage");


function setToday(){

    const today = new Date();

    const year =
        today.getFullYear();

    const month =
        String(today.getMonth() + 1)
        .padStart(2,"0");

    const day =
        String(today.getDate())
        .padStart(2,"0");

    workDate.value =
        `${year}-${month}-${day}`;

}

setToday();


function saveData(){

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(works)
    );

}


function createId(){

    return Date.now().toString()
        + Math.random()
        .toString(36)
        .slice(2);

}


/* TIME FORMAT */

function formatTime(value){

    value = value.trim();

    if(value === ""){
        return "";
    }

    const number =
        Number(value);

    if(!isNaN(number)){

        return number.toFixed(2);

    }

    return value;

}


function renderWorks(){

    workTableBody.innerHTML = "";

    if(works.length === 0){

        emptyMessage.style.display =
            "block";

        return;

    }

    emptyMessage.style.display =
        "none";

    works.forEach((work,index)=>{

        const tr =
            document.createElement("tr");


        /* Date */

        const dateTd =
            document.createElement("td");

        const dateInput =
            document.createElement("input");

        dateInput.type = "date";

        dateInput.value =
            work.date || "";

        dateInput.autocomplete =
            "off";

        dateInput.addEventListener(
            "input",
            function(){

                works[index].date =
                    this.value;

                saveData();

            }
        );

        dateTd.appendChild(
            dateInput
        );


        /* Description */

        const descriptionTd =
            document.createElement("td");

        const descriptionInput =
            document.createElement("input");

        descriptionInput.type =
            "text";

        descriptionInput.value =
            work.description || "";

        descriptionInput.autocomplete =
            "off";

        descriptionInput.placeholder =
            "Work description";

        descriptionInput.addEventListener(
            "input",
            function(){

                works[index].description =
                    this.value;

                saveData();

            }
        );

        descriptionTd.appendChild(
            descriptionInput
        );


        /* Time */

        const timeTd =
            document.createElement("td");

        const timeInput =
            document.createElement("input");

        timeInput.type =
            "text";

        timeInput.value =
            work.time || "";

        timeInput.autocomplete =
            "off";

        timeInput.placeholder =
            "Time";


        timeInput.addEventListener(
            "blur",
            function(){

                this.value =
                    formatTime(this.value);

                works[index].time =
                    this.value;

                saveData();

            }
        );


        timeInput.addEventListener(
            "keydown",
            function(event){

                if(event.key === "Enter"){

                    event.preventDefault();

                    this.value =
                        formatTime(this.value);

                    works[index].time =
                        this.value;

                    saveData();

                }

            }
        );


        timeInput.addEventListener(
            "input",
            function(){

                works[index].time =
                    this.value;

                saveData();

            }
        );


        timeTd.appendChild(
            timeInput
        );


        /* Action */

        const actionTd =
            document.createElement("td");

        const actionSelect =
            document.createElement("select");

        actionSelect.className =
            "action-select";


        const pendingOption =
            document.createElement("option");

        pendingOption.value =
            "Pending";

        pendingOption.textContent =
            "Pending";


        const completedOption =
            document.createElement("option");

        completedOption.value =
            "Completed";

        completedOption.textContent =
            "Completed";


        const partialOption =
            document.createElement("option");

        partialOption.value =
            "Partial";

        partialOption.textContent =
            "Partial";


        actionSelect.appendChild(
            pendingOption
        );

        actionSelect.appendChild(
            completedOption
        );

        actionSelect.appendChild(
            partialOption
        );


        actionSelect.value =
            work.action || "Pending";


        actionSelect.addEventListener(
            "change",
            function(){

                works[index].action =
                    this.value;

                updateActionColor(this);

                saveData();

            }
        );


        actionTd.appendChild(
            actionSelect
        );


        /* Delete */

        const deleteTd =
            document.createElement("td");

        const deleteBtn =
            document.createElement("button");

        deleteBtn.type =
            "button";

        deleteBtn.className =
            "delete-btn";

        deleteBtn.textContent =
            "×";

        deleteBtn.setAttribute(
            "aria-label",
            "Delete"
        );


        deleteBtn.addEventListener(
            "click",
            function(){

                works.splice(index,1);

                saveData();

                renderWorks();

            }
        );


        deleteTd.appendChild(
            deleteBtn
        );


        tr.appendChild(dateTd);
        tr.appendChild(descriptionTd);
        tr.appendChild(timeTd);
        tr.appendChild(actionTd);
        tr.appendChild(deleteTd);

        workTableBody.appendChild(tr);

        updateActionColor(
            actionSelect
        );

    });

}


function updateActionColor(select){

    if(select.value === "Completed"){

        select.style.background =
            "#ecfdf5";

        select.style.borderColor =
            "#6ee7b7";

        select.style.color =
            "#047857";

    }

    else if(select.value === "Partial"){

        select.style.background =
            "#fff7ed";

        select.style.borderColor =
            "#fdba74";

        select.style.color =
            "#c2410c";

    }

    else{

        select.style.background =
            "#fffbeb";

        select.style.borderColor =
            "#fcd34d";

        select.style.color =
            "#92400e";

    }

}


function addWork(){

    const date =
        workDate.value.trim();

    const description =
        workDescription.value.trim();

    const time =
        formatTime(
            workTime.value
        );


    if(!date){

        workDate.focus();

        return;

    }


    if(!description){

        workDescription.focus();

        return;

    }


    workTime.value =
        time;


    works.push({

        id:createId(),

        date:date,

        description:description,

        time:time,

        action:"Pending"

    });


    saveData();

    renderWorks();


    workDescription.value =
        "";

    workTime.value =
        "";

    workDescription.focus();

}


addWorkBtn.addEventListener(
    "click",
    addWork
);


/* BACKUP */

backupBtn.addEventListener(
    "click",
    function(){

        const backupData = {

            app:"Work Planner",

            version:1,

            backupDate:
                new Date().toISOString(),

            works:works

        };


        const json =
            JSON.stringify(
                backupData,
                null,
                2
            );


        const blob =
            new Blob(
                [json],
                {
                    type:
                    "application/octet-stream"
                }
            );


        const url =
            URL.createObjectURL(blob);


        const link =
            document.createElement("a");


        link.href = url;


        const today =
            new Date();


        const dateName =
            today.getFullYear()
            + "-"
            + String(
                today.getMonth()+1
              ).padStart(2,"0")
            + "-"
            + String(
                today.getDate()
              ).padStart(2,"0");


        link.download =
            "Work-Planner-Backup-"
            + dateName
            + ".backup";


        link.style.display =
            "none";


        document.body.appendChild(
            link
        );


        link.click();


        document.body.removeChild(
            link
        );


        setTimeout(
            function(){

                URL.revokeObjectURL(url);

            },
            1000
        );

    }
);


/* RESTORE */

restoreBtn.addEventListener(
    "click",
    function(){

        restoreFile.value = "";

        restoreFile.click();

    }
);


restoreFile.addEventListener(
    "change",
    function(){

        const file =
            this.files[0];


        if(!file){
            return;
        }


        const reader =
            new FileReader();


        reader.onload =
            function(event){

                try{

                    const data =
                        JSON.parse(
                            event.target.result
                        );


                    let restoredWorks =
                        null;


                    if(Array.isArray(data)){

                        restoredWorks =
                            data;

                    }

                    else if(
                        data &&
                        Array.isArray(data.works)
                    ){

                        restoredWorks =
                            data.works;

                    }


                    if(!restoredWorks){

                        alert(
                            "Invalid backup file."
                        );

                        return;

                    }


                    const confirmed =
                        confirm(
                            "Restore this backup? Current data will be replaced."
                        );


                    if(!confirmed){

                        return;

                    }


                    works =
                        restoredWorks;


                    saveData();

                    renderWorks();


                    alert(
                        "Backup restored successfully."
                    );

                }

                catch(error){

                    alert(
                        "Could not restore the backup file."
                    );

                }

            };


        reader.readAsText(file);

    }
);


/* Enter Navigation */

const formFields = [

    workDate,

    workDescription,

    workTime,

    addWorkBtn

];


formFields.forEach(
    (field,index)=>{

        field.addEventListener(
            "keydown",
            function(event){

                if(event.key === "Enter"){

                    event.preventDefault();


                    if(field === workTime){

                        workTime.value =
                            formatTime(
                                workTime.value
                            );

                    }


                    if(field === addWorkBtn){

                        addWork();

                        return;

                    }


                    const nextField =
                        formFields[index + 1];


                    if(nextField){

                        nextField.focus();

                    }

                }

            }
        );

    }
);


/* Service Worker */

if("serviceWorker" in navigator){

    window.addEventListener(
        "load",
        function(){

            navigator.serviceWorker
                .register("sw.js")
                .catch(
                    function(error){

                        console.log(
                            "Service Worker registration failed:",
                            error
                        );

                    }
                );

        }
    );

}


renderWorks();

</script>

</body>
</html>
