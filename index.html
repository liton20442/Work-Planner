<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
      viewport-fit=cover">

<meta name="theme-color" content="#0f766e">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Work Planner">

<link rel="manifest" href="manifest.json">

<title>Work Planner</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    background:#f4f7f8;
    color:#1f2937;
}

header{
    background:#0f766e;
    color:white;
    padding:18px 14px;
    text-align:center;
    position:sticky;
    top:0;
    z-index:10;
    box-shadow:0 4px 12px rgba(15,118,110,.22);
}

header h1{
    margin:0;
    font-size:24px;
    font-weight:700;
}

header p{
    margin:5px 0 0;
    font-size:14px;
    opacity:.95;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:9px;
}

.utility-buttons{
    display:flex;
    gap:8px;
    margin-bottom:12px;
}

.utility-buttons button{
    flex:1;
    min-height:44px;
    border:0;
    border-radius:8px;
    color:white;
    font-size:16px;
    font-weight:700;
    box-shadow:0 3px 8px rgba(0,0,0,.15);
}

.backup-btn{
    background:#2563eb;
}

.restore-btn{
    background:#7c3aed;
}

.table-card{
    background:#ffffff;
    border-radius:14px;
    box-shadow:0 4px 14px rgba(15,118,110,.10);
    overflow:hidden;
    border:1px solid #dcefeb;
}

.table-wrap{
    width:100%;
    overflow:hidden;
}

/* FIX: real visible gap between columns */
table{
    width:100%;
    max-width:100%;
    border-collapse:separate;
    border-spacing:0;
    table-layout:fixed;
}

thead{
    background:#e5f5f2;
}

th{
    padding:8px 4px;
    text-align:left;
    font-size:12px;
    font-weight:700;
    white-space:nowrap;
    border-bottom:1px solid #b9dfda;
    color:#134e4a;
    overflow:hidden;
    min-width:0;
    max-width:100%;
}

td{
    padding:0 4px;
    margin:0;
    font-size:16px;
    border-bottom:1px solid #e5e7eb;
    vertical-align:middle;
    background:#ffffff;
    overflow:hidden;
    min-width:0;
    max-width:100%;
}

/* Actual visible separation between columns */
th:nth-child(2),
td:nth-child(2){
    border-left:8px solid #f4f7f8;
}

th:nth-child(3),
td:nth-child(3){
    border-left:5px solid #f4f7f8;
}

/* Fixed column widths */
th:nth-child(1),
td:nth-child(1){
    width:28%;
}

th:nth-child(2),
td:nth-child(2){
    width:52%;
}

th:nth-child(3),
td:nth-child(3){
    width:20%;
    text-align:center;
}

td input{
    display:block;
    width:100%;
    min-width:0;
    max-width:100%;
    margin:0;
    min-height:38px;
    border:1px solid #cbd5e1;
    border-radius:7px;
    padding:6px 4px;
    font-size:16px;
    background:white;
}

td input:focus{
    outline:none;
    border-color:#0d9488;
    box-shadow:0 0 0 3px rgba(13,148,136,.13);
}

.delete-btn{
    width:32px;
    min-width:32px;
    max-width:32px;
    height:32px;
    min-height:32px;
    padding:0;
    border:0;
    border-radius:7px;
    background:#ef4444;
    color:white;
    font-size:19px;
    line-height:1;
    display:inline-flex;
    align-items:center;
    justify-content:center;
}

.empty{
    text-align:center;
    padding:25px 15px;
    color:#64748b;
    font-size:14px;
    background:#f8fffe;
}

@media(max-width:700px){

    .container{
        padding:6px;
    }

    header h1{
        font-size:22px;
    }

    .table-wrap{
        width:100%;
        overflow:hidden;
    }

    table{
        width:100%;
        max-width:100%;
        border-collapse:separate;
        border-spacing:0;
        table-layout:fixed;
    }

    th{
        font-size:11px;
        padding:7px 3px;
        min-width:0;
        max-width:100%;
    }

    td{
        font-size:16px;
        padding:0 3px;
        min-width:0;
        max-width:100%;
    }

    /* Mobile gap */
    th:nth-child(2),
    td:nth-child(2),
    th:nth-child(3),
    td:nth-child(3){
        border-left:8px solid #f4f7f8;
    }

    td input{
        width:100%;
        min-width:0;
        max-width:100%;
        margin:0;
        font-size:16px;
        min-height:38px;
        padding:6px 3px;
    }

    .delete-btn{
        width:30px;
        min-width:30px;
        max-width:30px;
        height:30px;
        min-height:30px;
        font-size:18px;
    }

}

</style>
</head>

<body>

<header>
    <h1>Work Planner</h1>
    <p>Daily Work Management</p>
</header>

<div class="container">

    <div class="utility-buttons">

        <button type="button"
                id="backupBtn"
                class="backup-btn">
            Backup Data
        </button>

        <button type="button"
                id="restoreBtn"
                class="restore-btn">
            Restore Data
        </button>

    </div>

    <input type="file"
           id="restoreFile"
           accept=".json,application/json,.backup"
           style="display:none;">

    <div class="table-card">

        <div class="table-wrap">

            <table>

                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Work Description</th>
                        <th>Delete</th>
                    </tr>
                </thead>

                <tbody id="workTableBody"></tbody>

            </table>

        </div>

        <div id="emptyMessage"
             class="empty"
             style="display:none;">
            No work added yet.
        </div>

    </div>

</div>

<script>

const STORAGE_KEY =
    "workPlannerDataV1";

let works = [];

try{

    const saved =
        localStorage.getItem(
            STORAGE_KEY
        );

    if(saved){

        const parsed =
            JSON.parse(saved);

        if(Array.isArray(parsed)){

            works = parsed;

        }

    }

}
catch(error){

    works = [];

}

const workTableBody =
    document.getElementById(
        "workTableBody"
    );

const emptyMessage =
    document.getElementById(
        "emptyMessage"
    );

const backupBtn =
    document.getElementById(
        "backupBtn"
    );

const restoreBtn =
    document.getElementById(
        "restoreBtn"
    );

const restoreFile =
    document.getElementById(
        "restoreFile"
    );

function getToday(){

    const d =
        new Date();

    const y =
        d.getFullYear();

    const m =
        String(
            d.getMonth()+1
        ).padStart(2,"0");

    const day =
        String(
            d.getDate()
        ).padStart(2,"0");

    return (
        y +
        "-" +
        m +
        "-" +
        day
    );

}

function saveData(){

    try{

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(works)
        );

    }
    catch(error){

        console.log(error);

    }

}

function createId(){

    return (
        Date.now().toString() +
        Math.random()
            .toString(36)
            .substring(2)
    );

}

function addNewRow(){

    works.push({

        id:createId(),

        date:getToday(),

        description:""

    });

    saveData();

    renderWorks();

}

function renderWorks(){

    workTableBody.innerHTML = "";

    if(works.length === 0){

        emptyMessage.style.display =
            "block";

        return;

    }

    emptyMessage.style.display =
        "none";

    works.forEach(
        function(work,index){

            const tr =
                document.createElement(
                    "tr"
                );

            const dateTd =
                document.createElement(
                    "td"
                );

            const dateInput =
                document.createElement(
                    "input"
                );

            dateInput.type =
                "date";

            dateInput.value =
                work.date || "";

            dateInput.autocomplete =
                "off";

            dateInput.dataset.index =
                index;

            dateInput.dataset.field =
                "date";

            dateInput.addEventListener(
                "input",
                function(){

                    works[index].date =
                        this.value;

                    saveData();

                }
            );

            dateTd.appendChild(
                dateInput
            );

            const descriptionTd =
                document.createElement(
                    "td"
                );

            const descriptionInput =
                document.createElement(
                    "input"
                );

            descriptionInput.type =
                "text";

            descriptionInput.value =
                work.description || "";

            descriptionInput.autocomplete =
                "off";

            descriptionInput.placeholder =
                "Work description";

            descriptionInput.dataset.index =
                index;

            descriptionInput.dataset.field =
                "description";

            descriptionInput.addEventListener(
                "input",
                function(){

                    works[index].description =
                        this.value;

                    saveData();

                }
            );

            descriptionTd.appendChild(
                descriptionInput
            );

            const deleteTd =
                document.createElement(
                    "td"
                );

            const deleteBtn =
                document.createElement(
                    "button"
                );

            deleteBtn.type =
                "button";

            deleteBtn.className =
                "delete-btn";

            deleteBtn.textContent =
                "×";

            deleteBtn.setAttribute(
                "aria-label",
                "Delete"
            );

            deleteBtn.addEventListener(
                "click",
                function(){

                    works.splice(
                        index,
                        1
                    );

                    saveData();

                    renderWorks();

                }
            );

            deleteTd.appendChild(
                deleteBtn
            );

            tr.appendChild(
                dateTd
            );

            tr.appendChild(
                descriptionTd
            );

            tr.appendChild(
                deleteTd
            );

            workTableBody.appendChild(
                tr
            );

        }
    );

}

workTableBody.addEventListener(
    "keydown",
    function(event){

        if(event.key !== "Enter"){

            return;

        }

        event.preventDefault();

        const current =
            event.target;

        if(
            !current ||
            current.tagName !==
                "INPUT"
        ){

            return;

        }

        const row =
            current.closest(
                "tr"
            );

        if(!row){

            return;

        }

        const inputs =
            Array.from(
                row.querySelectorAll(
                    "input"
                )
            );

        const currentIndex =
            inputs.indexOf(
                current
            );

        const rowIndex =
            Number(
                current.dataset.index
            );

        if(
            currentIndex === 0
        ){

            if(inputs[1]){

                inputs[1].focus();

            }

            return;

        }

        if(
            currentIndex === 1
        ){

            if(
                rowIndex ===
                works.length - 1
            ){

                works.push({

                    id:createId(),

                    date:getToday(),

                    description:""

                });

                saveData();

                renderWorks();

                const rows =
                    workTableBody
                    .querySelectorAll(
                        "tr"
                    );

                const newRow =
                    rows[
                        rows.length - 1
                    ];

                if(newRow){

                    const newInputs =
                        newRow
                        .querySelectorAll(
                            "input"
                        );

                    if(
                        newInputs[1]
                    ){

                        newInputs[1].focus();

                    }

                }

                return;

            }

            const nextRow =
                workTableBody
                .querySelectorAll(
                    "tr"
                )[
                    rowIndex + 1
                ];

            if(nextRow){

                const nextInputs =
                    nextRow
                    .querySelectorAll(
                        "input"
                    );

                if(
                    nextInputs[0]
                ){

                    nextInputs[0].focus();

                }

            }

        }

    }
);

backupBtn.addEventListener(
    "click",
    function(){

        const backupData = {

            app:"Work Planner",

            version:1,

            backupDate:
                new Date()
                    .toISOString(),

            works:works

        };

        const json =
            JSON.stringify(
                backupData,
                null,
                2
            );

        const blob =
            new Blob(
                [json],
                {
                    type:
                        "application/octet-stream"
                }
            );

        const url =
            URL.createObjectURL(
                blob
            );

        const link =
            document.createElement(
                "a"
            );

        link.href =
            url;

        const d =
            new Date();

        const dateName =
            d.getFullYear()
            + "-"
            + String(
                d.getMonth()+1
            ).padStart(2,"0")
            + "-"
            + String(
                d.getDate()
            ).padStart(2,"0");

        link.download =
            "Work-Planner-Backup-"
            + dateName
            + ".backup";

        document.body.appendChild(
            link
        );

        link.click();

        document.body.removeChild(
            link
        );

        setTimeout(
            function(){

                URL.revokeObjectURL(
                    url
                );

            },
            1000
        );

    }
);

restoreBtn.addEventListener(
    "click",
    function(){

        restoreFile.value =
            "";

        restoreFile.click();

    }
);

restoreFile.addEventListener(
    "change",
    function(){

        const file =
            this.files[0];

        if(!file){

            return;

        }

        const reader =
            new FileReader();

        reader.onload =
            function(event){

                try{

                    const data =
                        JSON.parse(
                            event.target.result
                        );

                    let restoredWorks =
                        null;

                    if(
                        Array.isArray(
                            data
                        )
                    ){

                        restoredWorks =
                            data;

                    }
                    else if(
                        data &&
                        Array.isArray(
                            data.works
                        )
                    ){

                        restoredWorks =
                            data.works;

                    }

                    if(
                        !restoredWorks
                    ){

                        alert(
                            "Invalid backup file."
                        );

                        return;

                    }

                    if(
                        !confirm(
                            "Restore this backup? Current data will be replaced."
                        )
                    ){

                        return;

                    }

                    works =
                        restoredWorks.map(
                            function(item){

                                return {

                                    id:
                                        item.id ||
                                        createId(),

                                    date:
                                        item.date ||
                                        getToday(),

                                    description:
                                        item.description ||
                                        ""

                                };

                            }
                        );

                    saveData();

                    renderWorks();

                    alert(
                        "Backup restored successfully."
                    );

                }
                catch(error){

                    alert(
                        "Could not restore the backup file."
                    );

                }

            };

        reader.readAsText(
            file
        );

    }
);

if(
    "serviceWorker" in navigator
){

    window.addEventListener(
        "load",
        function(){

            navigator.serviceWorker
                .register(
                    "sw.js"
                )
                .catch(
                    function(error){

                        console.log(
                            "Service Worker registration failed:",
                            error
                        );

                    }
                );

        }
    );

}

if(
    works.length === 0
){

    addNewRow();

}
else{

    renderWorks();

}

</script>

</body>
</html>
