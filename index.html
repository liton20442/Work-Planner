<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
      viewport-fit=cover">

<meta name="theme-color" content="#0f766e">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Work Planner">

<title>Work Planner</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    background:#f3f7f7;
    color:#1f2937;
}

header{
    background:#0f766e;
    color:white;
    padding:18px 14px;
    text-align:center;
    position:sticky;
    top:0;
    z-index:10;
}

header h1{
    margin:0;
    font-size:24px;
    font-weight:700;
}

header p{
    margin:5px 0 0;
    font-size:14px;
    opacity:.9;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:14px;
}

.form-card{
    background:white;
    border-radius:12px;
    padding:14px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
    margin-bottom:15px;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 2fr 1fr auto;
    gap:10px;
    align-items:end;
}

.field{
    display:flex;
    flex-direction:column;
}

.field label{
    font-size:14px;
    font-weight:600;
    margin-bottom:6px;
}

input,
select,
button{
    width:100%;
    min-height:46px;
    border:1px solid #cbd5e1;
    border-radius:8px;
    padding:10px 12px;
    font-size:16px;
    background:white;
}

input:focus,
select:focus{
    outline:none;
    border-color:#0f766e;
    box-shadow:0 0 0 2px rgba(15,118,110,.12);
}

button{
    background:#0f766e;
    color:white;
    border:none;
    font-weight:600;
    cursor:pointer;
    padding-left:18px;
    padding-right:18px;
}

button:active{
    transform:scale(.98);
}

.table-card{
    background:white;
    border-radius:12px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
    overflow:hidden;
}

.table-wrap{
    width:100%;
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:720px;
}

thead{
    background:#e6f2f1;
}

th{
    padding:11px 10px;
    text-align:left;
    font-size:14px;
    font-weight:700;
    white-space:nowrap;
    border-bottom:1px solid #cbd5e1;
}

td{
    padding:10px;
    font-size:16px;
    border-bottom:1px solid #e5e7eb;
    vertical-align:middle;
}

td input,
td select{
    min-height:42px;
    font-size:16px;
    padding:8px 10px;
}

.action-select{
    min-width:125px;
}

.delete-btn{
    width:42px;
    min-width:42px;
    height:42px;
    min-height:42px;
    padding:0;
    border-radius:8px;
    background:#dc2626;
    font-size:22px;
    line-height:1;
    display:flex;
    align-items:center;
    justify-content:center;
}

.empty{
    text-align:center;
    padding:30px 15px;
    color:#64748b;
    font-size:15px;
}

@media(max-width:700px){
    .container{
        padding:10px;
    }

    .form-grid{
        grid-template-columns:1fr;
        gap:9px;
    }

    .form-card{
        padding:12px;
    }

    header h1{
        font-size:22px;
    }

    table{
        min-width:760px;
    }

    th{
        font-size:13px;
        padding:10px 8px;
    }

    td{
        font-size:16px;
        padding:8px;
    }
}
</style>
</head>

<body>

<header>
    <h1>Work Planner</h1>
    <p>Daily Work Management</p>
</header>

<div class="container">

    <div class="form-card">

        <div class="form-grid">

            <div class="field">
                <label for="workDate">Date</label>
                <input type="text"
                       id="workDate"
                       autocomplete="off"
                       placeholder="Enter date">
            </div>

            <div class="field">
                <label for="workDescription">Work Description</label>
                <input type="text"
                       id="workDescription"
                       autocomplete="off"
                       placeholder="Enter work description">
            </div>

            <div class="field">
                <label for="workTime">Time</label>
                <input type="text"
                       id="workTime"
                       autocomplete="off"
                       placeholder="Enter time">
            </div>

            <div class="field">
                <button type="button" id="addWorkBtn">Add Work</button>
            </div>

        </div>

    </div>

    <div class="table-card">

        <div class="table-wrap">

            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Work Description</th>
                        <th>Time</th>
                        <th>Action</th>
                        <th>Delete</th>
                    </tr>
                </thead>

                <tbody id="workTableBody"></tbody>

            </table>

        </div>

        <div id="emptyMessage" class="empty">
            No work added yet.
        </div>

    </div>

</div>

<script>
const STORAGE_KEY = "workPlannerDataV1";

let works = [];

try{
    const saved = localStorage.getItem(STORAGE_KEY);

    if(saved){
        const parsed = JSON.parse(saved);

        if(Array.isArray(parsed)){
            works = parsed;
        }
    }
}catch(error){
    works = [];
}

const workDate = document.getElementById("workDate");
const workDescription = document.getElementById("workDescription");
const workTime = document.getElementById("workTime");
const addWorkBtn = document.getElementById("addWorkBtn");
const workTableBody = document.getElementById("workTableBody");
const emptyMessage = document.getElementById("emptyMessage");

function saveData(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(works));
}

function createId(){
    return Date.now().toString() + Math.random().toString(36).slice(2);
}

function renderWorks(){

    workTableBody.innerHTML = "";

    if(works.length === 0){
        emptyMessage.style.display = "block";
        return;
    }

    emptyMessage.style.display = "none";

    works.forEach((work, index) => {

        const tr = document.createElement("tr");

        const dateTd = document.createElement("td");
        const dateInput = document.createElement("input");

        dateInput.type = "text";
        dateInput.value = work.date || "";
        dateInput.autocomplete = "off";
        dateInput.placeholder = "Date";

        dateInput.addEventListener("input", function(){
            works[index].date = this.value;
            saveData();
        });

        dateTd.appendChild(dateInput);

        const descriptionTd = document.createElement("td");
        const descriptionInput = document.createElement("input");

        descriptionInput.type = "text";
        descriptionInput.value = work.description || "";
        descriptionInput.autocomplete = "off";
        descriptionInput.placeholder = "Work description";

        descriptionInput.addEventListener("input", function(){
            works[index].description = this.value;
            saveData();
        });

        descriptionTd.appendChild(descriptionInput);

        const timeTd = document.createElement("td");
        const timeInput = document.createElement("input");

        timeInput.type = "text";
        timeInput.value = work.time || "";
        timeInput.autocomplete = "off";
        timeInput.placeholder = "Time";

        timeInput.addEventListener("input", function(){
            works[index].time = this.value;
            saveData();
        });

        timeTd.appendChild(timeInput);

        const actionTd = document.createElement("td");
        const actionSelect = document.createElement("select");

        actionSelect.className = "action-select";

        const pendingOption = document.createElement("option");
        pendingOption.value = "Pending";
        pendingOption.textContent = "Pending";

        const completedOption = document.createElement("option");
        completedOption.value = "Completed";
        completedOption.textContent = "Completed";

        const partialOption = document.createElement("option");
        partialOption.value = "Partial";
        partialOption.textContent = "Partial";

        actionSelect.appendChild(pendingOption);
        actionSelect.appendChild(completedOption);
        actionSelect.appendChild(partialOption);

        actionSelect.value = work.action || "Pending";

        actionSelect.addEventListener("change", function(){
            works[index].action = this.value;
            saveData();
        });

        actionTd.appendChild(actionSelect);

        const deleteTd = document.createElement("td");

        const deleteBtn = document.createElement("button");
        deleteBtn.type = "button";
        deleteBtn.className = "delete-btn";
        deleteBtn.textContent = "×";
        deleteBtn.setAttribute("aria-label", "Delete");

        deleteBtn.addEventListener("click", function(){

            works.splice(index, 1);

            saveData();
            renderWorks();

        });

        deleteTd.appendChild(deleteBtn);

        tr.appendChild(dateTd);
        tr.appendChild(descriptionTd);
        tr.appendChild(timeTd);
        tr.appendChild(actionTd);
        tr.appendChild(deleteTd);

        workTableBody.appendChild(tr);
    });
}

function addWork(){

    const date = workDate.value.trim();
    const description = workDescription.value.trim();
    const time = workTime.value.trim();

    if(!date){
        workDate.focus();
        return;
    }

    if(!description){
        workDescription.focus();
        return;
    }

    if(!time){
        workTime.focus();
        return;
    }

    works.push({
        id:createId(),
        date:date,
        description:description,
        time:time,
        action:"Pending"
    });

    saveData();
    renderWorks();

    workDate.value = "";
    workDescription.value = "";
    workTime.value = "";

    workDate.focus();
}

addWorkBtn.addEventListener("click", addWork);


/* Enter key moves to the next field */

const formFields = [
    workDate,
    workDescription,
    workTime,
    addWorkBtn
];

formFields.forEach((field, index) => {

    field.addEventListener("keydown", function(event){

        if(event.key === "Enter"){

            event.preventDefault();

            if(field === addWorkBtn){
                addWork();
                return;
            }

            const nextField = formFields[index + 1];

            if(nextField){
                nextField.focus();
            }
        }

    });

});


renderWorks();
</script>

</body>
</html>
